server {
    listen 80;
    listen [::]:80;
    server_name wispo-cms.45.12.74.66.nip.io;

    access_log /www/wwwlogs/wispo-cms-preview.access.log;
    error_log /www/wwwlogs/wispo-cms-preview.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot-wispo;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wispo-cms.45.12.74.66.nip.io;

    access_log /www/wwwlogs/wispo-cms-preview.access.log;
    error_log /www/wwwlogs/wispo-cms-preview.error.log;

    ssl_certificate /etc/letsencrypt/live/wispo-cms.45.12.74.66.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wispo-cms.45.12.74.66.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:WispoTLS:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4300/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The CMS shell changes between preview releases. Never let a browser or
    # shared proxy reuse an old HTML document with obsolete JavaScript chunks.
    location = / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
