# Temporary HTTP-only configuration for the first Let's Encrypt challenge.
server {
    listen 80;
    listen [::]:80;
    server_name wispo-cms.129.101.122.78.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}
