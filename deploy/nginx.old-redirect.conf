# Short-lived redirect for bookmarks after the Wispo CMS data and containers move
# to the customer VDS. The old server does not serve application requests.
server {
    listen 80;
    listen [::]:80;
    server_name wispo-cms.45.12.74.66.nip.io cms.kpbox.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot-wispo;
        default_type text/plain;
    }

    location ^~ /api/ { return 410; }
    location / { return 302 https://wispo-cms.129.101.122.78.nip.io$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wispo-cms.45.12.74.66.nip.io;
    ssl_certificate /etc/letsencrypt/live/wispo-cms.45.12.74.66.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wispo-cms.45.12.74.66.nip.io/privkey.pem;

    location ^~ /api/ { return 410; }
    location / { return 302 https://wispo-cms.129.101.122.78.nip.io$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.kpbox.ru;
    ssl_certificate /etc/letsencrypt/live/cms.kpbox.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.kpbox.ru/privkey.pem;

    location ^~ /api/ { return 410; }
    location / { return 302 https://wispo-cms.129.101.122.78.nip.io$request_uri; }
}
