name: wispo-cms-local

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wispo_cms}
      POSTGRES_USER: ${POSTGRES_USER:-wispo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - wispo_local_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - wispo_local_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  dependencies:
    image: node:24-alpine
    working_dir: /workspace
    command:
      - sh
      - -lc
      - corepack pnpm install --frozen-lockfile
    volumes:
      - .:/workspace
      - wispo_local_node_modules:/workspace/node_modules
      - wispo_local_api_node_modules:/workspace/apps/api/node_modules
      - wispo_local_web_node_modules:/workspace/apps/web/node_modules
      - wispo_local_pnpm_store:/workspace/.pnpm-store
    restart: "no"

  database-bootstrap:
    image: node:24-alpine
    working_dir: /workspace
    command:
      - corepack
      - pnpm
      - --dir
      - apps/api
      - exec
      - ts-node
      - --transpile-only
      - scripts/bootstrap-local-database.ts
    depends_on:
      dependencies:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wispo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wispo_cms}
      DB_SSL: "false"
    volumes:
      - .:/workspace
      - wispo_local_node_modules:/workspace/node_modules
      - wispo_local_api_node_modules:/workspace/apps/api/node_modules
      - wispo_local_pnpm_store:/workspace/.pnpm-store
    restart: "no"

  api:
    image: node:24-alpine
    working_dir: /workspace
    command: ["corepack", "pnpm", "--dir", "apps/api", "start:dev"]
    restart: unless-stopped
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wispo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wispo_cms}
      REDIS_URL: redis://redis:6379
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "false"
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3300},http://127.0.0.1:${WEB_PORT:-3300}
      PUBLIC_DOMAIN_TARGETS: ""
      WISPO_RESERVED_HOSTS: localhost,127.0.0.1
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Wispo Local Admin}
      MEDIA_ROOT: /data/media
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/workspace
      - wispo_local_node_modules:/workspace/node_modules
      - wispo_local_api_node_modules:/workspace/apps/api/node_modules
      - wispo_local_pnpm_store:/workspace/.pnpm-store
      - wispo_local_media:/data/media
    ports:
      - "127.0.0.1:${API_PORT_HOST:-4300}:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  web:
    image: node:24-alpine
    working_dir: /workspace
    command: ["corepack", "pnpm", "--dir", "apps/web", "dev", "--hostname", "0.0.0.0"]
    restart: unless-stopped
    depends_on:
      dependencies:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      API_PROXY_URL: http://api:4000
      PUBLIC_APP_URL: http://localhost:${WEB_PORT:-3300}
      WISPO_RESERVED_HOSTS: localhost,127.0.0.1
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/workspace
      - wispo_local_node_modules:/workspace/node_modules
      - wispo_local_web_node_modules:/workspace/apps/web/node_modules
      - wispo_local_pnpm_store:/workspace/.pnpm-store
      - wispo_local_web_next:/workspace/apps/web/.next
    ports:
      - "127.0.0.1:${WEB_PORT:-3300}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

volumes:
  wispo_local_postgres:
  wispo_local_redis:
  wispo_local_node_modules:
  wispo_local_api_node_modules:
  wispo_local_web_node_modules:
  wispo_local_pnpm_store:
  wispo_local_web_next:
  wispo_local_media:
